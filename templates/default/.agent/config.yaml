models:
  lead:
    provider: anthropic
    model: claude-opus-5
  complex:
    provider: anthropic
    model: claude-opus-5
  worker:
    provider: anthropic
    model: claude-sonnet-5
  cheap:
    provider: anthropic
    model: claude-haiku-4-5
  reviewer:
    provider: openai
    model: gpt-5.1

agents:
  orchestrator: lead
  defaultWorker: coder
  explorer: explorer
  reviewer: reviewer

