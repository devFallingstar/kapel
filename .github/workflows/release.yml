name: Release

# Publishes to npm. Three ways to run it:
#  - push a version tag (v1.2.3) matching package.json's "version",
#  - trigger manually (workflow_dispatch), or
#  - change the .release file on main (for environments that can push
#    branches but not tags and cannot dispatch workflows).
# The non-tag triggers create and push the v<version> tag themselves before
# publishing. Requires the NPM_TOKEN repository secret (npm automation token
# or granular token with 2FA bypass).

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".release"]
  workflow_dispatch:

permissions:
  contents: write # tag creation on manual dispatch
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run bundle
      - run: npm test
      - name: Resolve release version
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "pkg=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/*)
              TAG_VERSION="${GITHUB_REF_NAME#v}"
              if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
                echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
                exit 1
              fi
              ;;
          esac
      - name: Create tag (non-tag triggers)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          TAG="v${{ steps.version.outputs.pkg }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — publishing that version."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
